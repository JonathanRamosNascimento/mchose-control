[workspace]
resolver = "3"
members = ["crates/mchose-core", "crates/mchose-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Jonathan Ramos <ramos.was.jonathan@gmail.com>"]
rust-version = "1.85"

[workspace.dependencies]
mchose-core = { path = "crates/mchose-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
